services:
  - type: web
    name: nextzen-events
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.4
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_PATH
        value: /var/data/nextzen.db
    disk:
      name: nextzen-data
      mountPath: /var/data
      sizeGB: 1
